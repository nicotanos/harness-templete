name: SDD

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sdd:
    name: Harness tests, gate, specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # The gate shells out to the openspec CLI to resolve changes, so both
        # runtimes belong in the same job. Splitting them makes the gate step
        # fail with "openspec CLI not found on PATH".
        run: |
          python3 -m pip install -r requirements.txt pytest
          npm install -g @fission-ai/openspec

      - name: Harness tests
        run: python3 -m pytest scripts/tests -q

      - name: Gate
        # Reports the first stage that is not DONE. On a branch with an open
        # change this is the real merge gate; on a tree with no change in
        # flight it reports idle and exits 0.
        run: python3 scripts/workflow_gate.py

      - name: OpenSpec validate
        run: openspec validate --all
